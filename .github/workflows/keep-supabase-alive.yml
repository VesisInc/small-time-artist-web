name: Supabase Keep Alive

on:
  schedule:
    # 00:00 UTC on the 1st, 7th, 13th, 19th, 25th, and 31st.
    # Supabase's free tier pauses after 7 days without activity, and GitHub
    # schedules can start late, so 6 days leaves a one-day buffer.
    # Cron can't do a rolling 6-day interval; the gap resets each month and never exceeds 6 days.
    - cron: '0 0 */6 * *'
  workflow_dispatch:

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Safety lock to prevent execution on other branches
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Query Supabase PostgreSQL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGCONNECT_TIMEOUT: '15'
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not configured"
            exit 1
          fi

          psql "$SUPABASE_DB_URL" \
            --no-psqlrc \
            --no-password \
            --set=ON_ERROR_STOP=1 \
            --command='SELECT 1;'
